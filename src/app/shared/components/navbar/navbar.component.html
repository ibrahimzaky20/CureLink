<header class="navbar">
  <div class="container navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__logo">CureLink</a>

    <!-- Desktop Nav -->
    <nav class="navbar__links" aria-label="Main navigation">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          [fragment]="item.fragment"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: item.route === '/' && !item.fragment }"
          class="navbar__link"
        >{{ item.label }}</a>
      }
    </nav>

    <!-- CTA Buttons -->
    <div class="navbar__actions">
      <a routerLink="/auth/login" class="btn btn-secondary navbar__btn">Sign In</a>
      <a routerLink="/auth/register" class="btn btn-primary navbar__btn">Get Started</a>
    </div>

    <!-- Mobile hamburger -->
    <button class="navbar__hamburger" (click)="toggleMobile()" aria-label="Toggle menu">
      <iconify-icon [icon]="mobileOpen() ? 'lucide:x' : 'lucide:menu'" width="22" height="22"></iconify-icon>
    </button>
  </div>

  <!-- Mobile Menu -->
  @if (mobileOpen()) {
    <div class="navbar__mobile">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          [fragment]="item.fragment"
          class="navbar__mobile-link"
          (click)="toggleMobile()"
        >{{ item.label }}</a>
      }
      <div class="navbar__mobile-actions">
        <a routerLink="/auth/login"    class="btn btn-secondary w-full text-center" (click)="toggleMobile()">Sign In</a>
        <a routerLink="/auth/register" class="btn btn-primary w-full text-center"      (click)="toggleMobile()">Get Started</a>
      </div>
    </div>
  }
</header>
