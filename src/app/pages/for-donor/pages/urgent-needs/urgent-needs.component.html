<!-- Page Header -->
<div class="page-header">
  <div>
    <h1 class="page-title">Urgent Needs</h1>
    <p class="page-subtitle">Here's what's happening with your donations today.</p>
  </div>
  <app-button label="Donate Medicine" [showPlusIcon]="true" link="../new-donation" />
</div>

<!-- Urgent Needs Card -->
<div class="card">
  <h2 class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
    </svg>
    Urgent Needs
  </h2>

  <div class="urgent-list">
    @for (need of urgentNeeds; track need.name + need.urgency) {
      <div class="urgent-item" [ngClass]="need.urgency.toLowerCase()">
        <div class="urgent-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 11.5 3c-.57 0-1.12.08-1.63.22" />
            <path d="M4.87 13.97A5.48 5.48 0 0 1 2 8.5a5.5 5.5 0 0 1 8.37-4.7" />
            <path d="M12 22s8-4 8-10V7" /><path d="M12 22s-8-4-8-10V7" />
          </svg>
        </div>
        <div class="urgent-info">
          <span class="urgent-name">{{ need.name }}</span>
          <span class="urgent-units">{{ need.units }}</span>
        </div>
        <span class="urgency-badge" [ngClass]="need.urgency.toLowerCase()">{{ need.urgency }}</span>
        <app-button label="Donate Now" size="sm" link="../new-donation" />
      </div>
    }
  </div>
</div>
