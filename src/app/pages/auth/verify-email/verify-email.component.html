<div class="auth-split">

  <!-- Left: Gradient Panel -->
  <div class="auth-split__panel">
    <div class="panel-inner">
      <h2 class="panel-title">Check Your Inbox</h2>
      <p class="panel-subtitle">We sent a 6-digit code to your email. Enter it below to verify your account.</p>
      <a routerLink="/auth/login" class="panel-btn">Back to Login</a>
    </div>
  </div>

  <!-- Right: Form Side -->
  <div class="auth-split__form">
    <div class="form-logo">CureLink</div>

    <div class="form-body">
      <h1 class="form-title">Verify your email</h1>

      <form (submit)="$event.preventDefault(); submit()">

        <!-- Email -->
        <div class="field">
          <label class="field-label">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>
            <input type="email" class="field-input" placeholder="name@example.com"
              [value]="email()" (input)="setEmail($any($event.target).value)" />
          </div>
        </div>

        <!-- OTP -->
        <div class="field">
          <label class="field-label">Verification code</label>
          <div class="otp-row" (paste)="onOtpPaste($event)">
            @for (digit of otp(); track $index) {
              <input
                #otpInput
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-box"
                [value]="digit"
                (input)="onOtpInput($index, $event)"
                (keydown)="onOtpKeydown($index, $event)"
              />
            }
          </div>
          <p class="otp-hint">Didn't receive a code? <a class="resend-link" href="#">Resend</a></p>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn">Verify Email &rarr;</button>

      </form>

      <p class="bottom-link">
        Wrong account? <a routerLink="/auth/login" class="link">Sign in with a different email</a>
      </p>
    </div>
  </div>

</div>
