<div class="admin-layout">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="hamburger" (click)="toggleMobile()" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <span class="logo" routerLink="/">CureLink</span>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="top-actions">
      <div class="admin-user">
        <div class="avatar">{{ userInitial() }}</div>
        <span class="admin-name">{{ userName() }}</span>
      </div>
    </div>
  </header>

  <!-- Mobile Overlay -->
  @if (mobileOpen()) {
    <div class="sidebar-overlay" (click)="closeMobile()"></div>
  }

  <!-- Body: Sidebar + Content -->
  <div class="layout-body">

    <!-- Sidebar -->
    <aside class="sidebar" [class.mobile-open]="mobileOpen()">
      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="dashboard" routerLinkActive="active" (click)="closeMobile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" routerLink="donations" routerLinkActive="active" (click)="closeMobile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
            <polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" y1="22.08" x2="12" y2="12" />
          </svg>
          <span>Donations</span>
        </a>
        <a class="nav-item" routerLink="pending-donations" routerLinkActive="active" (click)="closeMobile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Pending Donations</span>
        </a>
        <a class="nav-item" routerLink="institutions" routerLinkActive="active" (click)="closeMobile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Institutions</span>
        </a>
        <a class="nav-item" routerLink="pending-institutions" routerLinkActive="active" (click)="closeMobile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
          <span>Pending Institutions</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <a class="nav-item logout" (click)="logout()" style="cursor:pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Log Out</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <router-outlet />
    </main>

  </div>
</div>
